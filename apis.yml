apis:
- aid: wmo:world-weather-information-service-api
  name: World Weather Information Service API
  tags:
  - Weather
  - Forecast
  - Climate
  tags_raw:
  - Weather
  - Forecasts
  - Climate
  humanURL: https://worldweather.wmo.int/en/dataguide.html
  baseURL: https://worldweather.wmo.int/en/json/
  properties:
  - url: https://worldweather.wmo.int/en/dataguide.html
    type: Documentation
  description: >-
    The WMO World Weather Information Service (WWIS) provides public JSON endpoints delivering official
    city weather forecasts and climatological data contributed by WMO member national meteorological and
    hydrological services. Data is freely accessible by city identifier with no authentication required.
    City forecasts include temperature, wind, humidity, and precipitation; climatological normals cover
    monthly averages. A full city list with identifiers is available for programmatic enumeration of supported
    locations.
- aid: wmo:oscar-surface-api
  name: OSCAR/Surface REST API
  tags:
  - Observations
  - Weather Stations
  - WIGOS
  - Metadata
  humanURL: https://oscar.wmo.int/surface/
  baseURL: https://oscar.wmo.int/surface/rest/api
  properties:
  - url: https://oscar.wmo.int/surface/
    type: Documentation
  - url: https://oscar.wmo.int/surface/rest/api?_wadl
    type: WADL
  description: >-
    The OSCAR/Surface REST API provides programmatic access to the WMO Observing Systems Capability Analysis
    and Review tool for surface-based stations. The public GET endpoints enable search and retrieval of
    station metadata records in JSON format covering WIGOS station identifiers, station locations, observation
    variables, and operational status. The search station endpoint supports pagination with up to 50,000
    station records per query. Authentication tokens are required for write (POST/XML upload) operations
    but not for read access.
- aid: wmo:wis2-global-broker-mqtt-api
  name: WIS2 Global Broker (MQTT)
  tags:
  - WIS2
  - Real-Time
  - MQTT
  - Pub-Sub
  - Notification
  tags_raw:
  - WIS2
  - Real-time
  - MQTT
  - Pub/Sub
  - Notifications
  humanURL: >-
    https://community.wmo.int/site/knowledge-hub/programmes-and-initiatives/wmo-information-system-wis/wis2-overview
  baseURL: mqtts://globalbroker.meteo.fr:8883
  properties:
  - url: >-
      https://community.wmo.int/site/knowledge-hub/programmes-and-initiatives/wmo-information-system-wis/wis2-overview
    type: Documentation
  - url: https://wmo-im.github.io/wis2-cookbook/cookbook/wis2-cookbook-DRAFT.html
    type: GettingStarted
  description: >-
    The WIS2 Global Broker provides an MQTT(S) publish-subscribe service that re-publishes real-time weather
    notification messages from all WIS2 Nodes worldwide. Subscribers connect using MQTTS on port 8883
    with public read-only credentials (username: everyone, password: everyone). Notification messages
    include data download links for core weather observations, forecasts, climate data, and alerts exchanged
    between WMO member nations under the WIS2 topic hierarchy.
- aid: wmo:whos-hydrological-api
  name: WHOS Hydrological Observing System API
  tags:
  - Hydrology
  - Water
  - Observations
  - Time Series
  humanURL: https://community.wmo.int/whos-web-services-and-supported-tools
  baseURL: https://whos.geodab.eu/gs-service/services/essi
  properties:
  - url: https://community.wmo.int/whos-web-services-and-supported-tools
    type: Documentation
  description: >-
    The WMO Hydrological Observing System (WHOS) provides multiple API interfaces for accessing global
    hydrological station data and time series. Available services include a REST/JSON DAB Observation
    and Measurement API, an OGC Sensor Observation Service (SOS), CUAHSI WaterML endpoints for compatibility
    with HydroDesktop and R WaterML libraries, and an ESRI Feature Server. All endpoints require a personal
    access token obtained via free registration at the WHOS registration portal. Supported views include
    whos-arctic, whos-plata, and the global whos view.
